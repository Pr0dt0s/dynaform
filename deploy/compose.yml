# docker compose -f deploy/compose.yml up -d --build
#
# Reference example for running behind an existing Traefik instance: TLS and routing are
# handled by Traefik, so this stack publishes NO ports — Traefik reaches it over an
# external Docker network you already have Traefik watching, and terminates TLS with
# your own ACME resolver. Copy deploy/.env.example to deploy/.env and set APP_DOMAIN,
# CERT_RESOLVER (the name of your Traefik certificatesResolvers entry), and
# TRAEFIK_NETWORK (the external network name Traefik is attached to) to match your setup.
# If you're not using Traefik, drop the `labels:`/`networks:` block below and add
# `ports: ["3000:3000"]` instead, then put whatever reverse proxy you use in front.
#
# No separate DB container: SQLite lives on a small named volume, and the server never
# writes anywhere else (secret values are written client-side, on the machine running the
# agent's skill script — never here).

name: dynaform

services:
  dynaform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/dynaform.db
      APP_ORIGIN: https://${APP_DOMAIN:-dynaform.example.com}
      FORM_TTL_MINUTES: ${FORM_TTL_MINUTES:-30}
    volumes:
      - dynaform-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dynaform.entrypoints: "websecure"
      traefik.http.routers.dynaform.rule: "Host(`${APP_DOMAIN:-dynaform.example.com}`)"
      traefik.http.routers.dynaform.tls: "true"
      traefik.http.routers.dynaform.tls.certresolver: "${CERT_RESOLVER:-letsencrypt}"
      traefik.http.routers.dynaform.middlewares: "dynaform-headers@docker"
      traefik.http.services.dynaform.loadbalancer.server.port: "3000"
      traefik.http.services.dynaform.loadbalancer.server.scheme: "http"

      # Plain HTTP redirects to HTTPS.
      traefik.http.routers.dynaform-http.entrypoints: "web"
      traefik.http.routers.dynaform-http.rule: "Host(`${APP_DOMAIN:-dynaform.example.com}`)"
      traefik.http.routers.dynaform-http.middlewares: "dynaform-https-redirect@docker"
      traefik.http.middlewares.dynaform-https-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.dynaform-https-redirect.redirectscheme.permanent: "true"

      # Security headers (Traefik doesn't add these unless declared here).
      traefik.http.middlewares.dynaform-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.dynaform-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.dynaform-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.dynaform-headers.headers.browserXssFilter: "true"
      traefik.http.middlewares.dynaform-headers.headers.frameDeny: "true"
      traefik.http.middlewares.dynaform-headers.headers.referrerPolicy: "strict-origin-when-cross-origin"
      traefik.http.middlewares.dynaform-headers.headers.customResponseHeaders.X-Robots-Tag: "noindex, nofollow"
      traefik.http.middlewares.dynaform-headers.headers.customRequestHeaders.X-Forwarded-Proto: "https"

volumes:
  dynaform-data:

networks:
  # Your existing Traefik instance's external network. Declared external so this stack
  # joins it rather than creating a second one Traefik isn't watching.
  traefik:
    name: ${TRAEFIK_NETWORK:-traf}
    external: true
